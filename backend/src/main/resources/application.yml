server:
  port: 8080

spring:
  application:
    name: training-management
  
  datasource:
    url: jdbc:mysql://localhost:3306/training_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.training.*.infrastructure.persistence

app:
  jwt:
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 2592000
    secret: training-management-jwt-secret-key-2026

  file:
    max-excel-size-mb: 20
    max-image-size-mb: 10
    max-pdf-size-mb: 30

  hour:
    allow-negative-balance: false

  report:
    max-retry-count: 3
    renderer: chromium

  import:
    batch-size: 300
    max-rows: 10000

logging:
  level:
    com.example.training: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework.security: DEBUG