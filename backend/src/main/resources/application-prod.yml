server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:training_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.training.*.infrastructure.persistence

app:
  jwt:
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 2592000
    secret: ${JWT_SECRET}

  file:
    max-excel-size-mb: 20
    max-image-size-mb: 10
    max-pdf-size-mb: 30

  hour:
    allow-negative-balance: false

  report:
    max-retry-count: 3
    renderer: chromium

  import:
    batch-size: 300
    max-rows: 10000

  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    mock-openid-when-disabled: false

  student:
    auto-generate-no-prefix: S
    max-children-per-parent: 6

  security:
    default-temp-password: ${DEFAULT_TEMP_PASSWORD}

logging:
  level:
    root: INFO
    com.example.training: INFO
    com.baomidou.mybatisplus: WARN
    org.springframework.security: WARN
