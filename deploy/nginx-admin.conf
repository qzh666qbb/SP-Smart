# ==============================================
# Nginx 配置：管理端（Vue SPA）+ 后端反向代理
# 路径：/etc/nginx/conf.d/training-admin.conf
# 域名：admin.yourdomain.com（按 .env ADMIN_DOMAIN 改）
# ==============================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    # SSL 证书（用 certbot 申请后自动替换下面路径）
    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 管理端静态资源（npm run build 产物上传到这里）
    root /opt/training/admin-web/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 → 后端 Spring Boot :8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
