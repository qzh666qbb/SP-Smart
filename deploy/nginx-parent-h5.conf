# ==============================================
# Nginx 配置：家长端 H5（可选，纯手机浏览器访问时才需要）
# 小程序发布不需要这份配置
# 路径：/etc/nginx/conf.d/training-parent.conf
# 域名：m.yourdomain.com（按 .env PARENT_H5_DOMAIN 改）
# ==============================================

server {
    listen 80;
    server_name m.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name m.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/m.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/training/parent-h5;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }
}
